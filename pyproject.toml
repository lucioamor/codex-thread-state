[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-thread-state"
version = "1.0.0"
description = "Thread State — deterministic status badges for Codex threads"
requires-python = ">=3.11"
license = {text = "CC-BY-NC-4.0"}
authors = [{name = "Lucio Amorim"}]
dependencies = []

[project.scripts]
thread-state = "thread_state:main"

[tool.setuptools.packages.find]
include = ["thread_state*"]
